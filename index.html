<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Brasil Radar</title>
<script>(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem("bydTheme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=r.getAttribute("data-theme");}
if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
r.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* =========================================================================
   BYD BRASIL RADAR — visual system
   Adapted from byd.com/br: Montserrat throughout, a charcoal (#252728)
   ground rather than black, hairline rules, generous vertical rhythm and
   almost no chrome. BYD's own site is monochrome because its colour comes
   from photography; a data tool cannot be, so saturated colour survives
   here in one place only — encoding data (BYD vs rivals, threat/opportunity,
   data quality) — and is desaturated to sit inside the charcoal system.
   ========================================================================= */
:root{
  /* BYD greys */
  /* byd.com uses #999999 for secondary text; on white that is 2.85:1, below
     AA. These stay in the same neutral family but are dark enough to read:
     muted 6.32:1 and faint 5.60:1 on white, 5.75 and 5.09 on the sunken grey. */
  --ink:#252728; --ink-2:#515253; --muted:#5E6061; --faint:#66686A;
  --paper:#FFFFFF; --card:#FFFFFF; --sunken:#F4F4F4; --line:#DEDEDE; --line-2:#E9E9E9;
  --bar:#252728; --bar-ink:#FFFFFF;
  /* emphasis is tonal, not chromatic */
  --accent:#252728; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  /* data encoding only */
  --pos:#1F7A57; --pos-bg:#E8F3EE; --pos-line:#CADED6;
  --neg:#A8443A; --neg-bg:#F7EAE8; --neg-line:#E6CFCB;
  --warn:#8A6D1B; --warn-bg:#F6F1E2; --warn-line:#E4DBC2;
  --cell-empty:#FFFFFF; --glow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Montserrat','Microsoft JhengHei','PingFang TC',Arial,'Helvetica Neue',Helvetica,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 80px}
.num,.kpi .v,.heat,.dtable td.num{font-variant-numeric:tabular-nums}

/* ---------- Masthead: slim charcoal bar, like byd.com ---------- */
.masthead{
  background:var(--bar); color:var(--bar-ink);
  margin:0 -24px; padding:20px 24px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;
}
.brandblock{display:flex;align-items:center;gap:16px}
.brand{font-family:inherit;font-weight:700;font-size:22px;letter-spacing:3px;line-height:1;color:var(--bar-ink)}
.brand span{color:var(--bar-ink);font-weight:400}
.brand-divider{width:1px;height:30px;background:rgba(255,255,255,.22)}
.subbrand{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.85)}
.subbrand .radar{flex:none}
.subbrand-txt{font-weight:600;font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.85);line-height:1.15}
.date-block{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.report-date{font-size:26px;font-weight:600;color:var(--bar-ink);letter-spacing:.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.date-window{font-size:11px;font-weight:400;color:rgba(255,255,255,.62);letter-spacing:.2px}
.date-nav{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16)}
/* The masthead keeps its charcoal ground in both themes, so everything
   inside it takes fixed light-on-dark colours — theme tokens invert here
   and would put near-white type on a white chip. */
.date-nav-label{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.6)}

/* ---------- Language + theme controls ---------- */
.lang-toggle{margin-left:auto;display:flex;flex-wrap:wrap;border:1px solid rgba(255,255,255,.28);overflow:hidden;flex-shrink:0}
.lang-toggle button{
  font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.6px;padding:6px 12px;
  border:0;border-left:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.78);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;min-height:26px;transition:background .15s,color .15s;
}
.lang-toggle button:first-child{border-left:0}
.lang-toggle button:hover{background:rgba(255,255,255,.1);color:#fff}
.lang-toggle button.on{background:#fff;color:#252728}
.theme-btn{
  font-family:inherit;font-size:13px;line-height:1;padding:6px 11px;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:rgba(255,255,255,.85);cursor:pointer;transition:background .15s;
}
.theme-btn:hover{background:rgba(255,255,255,.12)}

/* ---------- Top-level tabs: underline nav, no boxes ---------- */
.tabnav{display:flex;flex-wrap:wrap;gap:0 26px;margin-top:26px;border-bottom:1px solid var(--line);padding-bottom:0}
.tabnav button{
  font-family:inherit;font-weight:600;font-size:13px;letter-spacing:.3px;padding:12px 0 11px;
  border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;
  position:relative;top:1px;transition:color .15s,border-color .15s;
}
.tabnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabnav button:not(.on):hover{color:var(--ink-2)}
.tabpanel{display:none}
.tabpanel.on{display:block}

/* ---------- Sub-tabs ---------- */
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.subnav button{
  font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.2px;padding:7px 15px;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.subnav button:hover{border-color:var(--ink-2);color:var(--ink)}
.subnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.subnav.sub2{margin:10px 0 6px}
.subnav.sub2 button{font-size:11px;padding:5px 12px}
.subpanel{display:none}
.subpanel.on{display:block}

/* ---------- Headings ---------- */
h2.sec{font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
h2.sec .hint{font-weight:400;font-size:11.5px;letter-spacing:.2px;text-transform:none;color:var(--faint)}
.dash-h{font-weight:600;font-size:23px;letter-spacing:-.2px;margin:26px 0 8px;color:var(--ink);text-wrap:balance}
h3.dash-h{font-size:17px;font-weight:600;margin-top:30px}
.dash-note{font-size:14px;color:var(--ink-2);max-width:68ch;margin-bottom:18px;line-height:1.65}
.dash-meta{font-size:11px;color:var(--faint);margin-bottom:14px;letter-spacing:.2px}

/* ---------- Period selector ---------- */
.periodbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:26px;padding:14px 18px;background:var(--sunken);border:1px solid var(--line)}
.periodbar select,.date-nav select{
  font-family:inherit;font-size:13px;font-weight:500;padding:7px 12px;
  border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;
}
.periodbar select:focus,.dash-sel:focus{outline:2px solid var(--ink);outline-offset:1px}
.period-hint{font-size:12px;color:var(--muted);line-height:1.55}
.dash-sel{font-family:inherit;font-size:13px;font-weight:500;padding:7px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;margin-bottom:16px}

/* ---------- Summary ---------- */
.summary{font-size:15.5px;max-width:72ch;margin-bottom:22px;color:var(--ink-2)}
.summary-list{list-style:none;margin:0;padding:0}
.summary-list li{position:relative;padding-left:22px;margin-bottom:13px;line-height:1.7}
.summary-list li:last-child{margin-bottom:0}
.summary-list li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:1px;background:var(--ink)}

/* ---------- KPI tiles ---------- */
.kpi-grid{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));margin-bottom:20px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--card);padding:16px 18px 17px}
.kpi .k{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:8px;font-weight:600}
.kpi .v{font-size:27px;font-weight:600;color:var(--ink);line-height:1.1;display:block;letter-spacing:-.5px}
.kpi .v.sm{font-size:17px;font-weight:600;letter-spacing:0}
.kpi .s{font-size:11.5px;color:var(--muted);display:block;margin-top:7px;line-height:1.5}

/* ---------- Heatmap ---------- */
.heat{width:100%;border-collapse:collapse;font-size:12.5px}
.heat th{font-weight:600;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);padding:8px;text-align:center}
.heat th.rowh{text-align:left}
.heat td.rowh{font-weight:500;font-size:12.5px;padding:8px 10px 8px 0;white-space:nowrap;color:var(--ink-2)}
.heat td.cell{text-align:center;padding:1px}
.heat td.cell button{width:100%;border:0;background:var(--sunken);padding:11px 4px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;min-width:44px;transition:outline .12s}
.heat td.cell button:hover{outline:2px solid var(--ink);outline-offset:-2px}
.heat td.cell button:disabled{cursor:default;color:#C4C4C4;background:var(--paper)}
.heat td.cell button:disabled:hover{outline:none}

/* ---------- Filters ---------- */
.filters{position:sticky;top:0;background:var(--paper);padding:16px 0 14px;margin-top:32px;border-bottom:1px solid var(--line);z-index:5}
.tabs,.pills{display:flex;flex-wrap:wrap;gap:8px}
.tabs{margin-bottom:11px}
.tabs button{font-family:inherit;font-weight:500;font-size:12.5px;padding:8px 15px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;transition:all .15s}
.tabs button:hover{border-color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button .n{font-size:11px;opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}
.pills button{font-family:inherit;font-size:11.5px;padding:6px 13px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.pills button:hover{border-color:var(--ink-2);color:var(--ink)}
.pills button.on{background:var(--accent-soft);border-color:var(--ink-2);color:var(--ink);font-weight:600}

/* ---------- News cards ---------- */
.cards{margin-top:26px;display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.card{background:var(--card);padding:22px 2px 24px;border-left:0}
.card .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:9px}
.card .co{font-weight:700;font-size:12px;letter-spacing:1.3px;text-transform:uppercase}
.card .loc{font-size:11px;color:var(--faint);letter-spacing:.3px}
.card .tag{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 9px;margin-left:auto}
.card.opp .tag{color:var(--pos);border-color:var(--pos-line);background:var(--pos-bg)}
.card.threat .tag{color:var(--neg);border-color:var(--neg-line);background:var(--neg-bg)}
.card .tag.low{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.card h3{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:12px;letter-spacing:-.2px;max-width:60ch;text-wrap:balance}
.card ul{list-style:none;margin-bottom:14px}
.card ul li{font-size:13.5px;color:var(--ink-2);padding-left:18px;position:relative;margin-bottom:5px;line-height:1.6}
.card ul li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:1px;background:var(--faint)}
.angle{background:var(--sunken);border-left:2px solid var(--ink);padding:12px 15px;font-size:13.5px;color:var(--ink-2);line-height:1.65;max-width:72ch}
.angle b{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:5px}
.src{margin-top:12px;font-size:11px;color:var(--faint);letter-spacing:.2px}
.src a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.src a:hover{border-bottom-color:var(--ink);color:var(--ink)}
.empty{padding:60px 0;text-align:center;color:var(--faint);display:none}

/* ---------- Charts ---------- */
.chart-box{position:relative;height:360px;background:var(--card);border:1px solid var(--line);padding:18px;margin-bottom:20px}
.chart-box.tall{height:440px}

/* ---------- Data-quality chips ---------- */
.dq{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.6px;padding:4px 10px;border:1px solid var(--line);background:var(--sunken);color:var(--muted);margin:3px 0}
.dq.high{color:var(--pos);border-color:var(--pos-line);background:var(--pos-bg)}
.dq.medium{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.dq.low{color:var(--neg);background:var(--neg-bg);border-color:var(--neg-line)}

/* ---------- Tables ---------- */
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px;background:var(--card)}
.dtable th{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);text-align:left;padding:11px 12px;border-bottom:1px solid var(--ink);font-weight:600}
.dtable td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.dtable td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.dtable tr.pick{cursor:pointer;transition:background .12s}
.dtable tr.pick:hover{background:var(--sunken)}
.dtable tr.sel{background:var(--accent-soft)}
.dtable tr.me td{font-weight:600;color:var(--ink)}
.up{color:var(--pos)}.down{color:var(--neg)}
.tbl-scroll{overflow-x:auto;margin-bottom:18px}

/* ---------- Entity / opportunity cards ---------- */
.opp-grid{display:grid;gap:1px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:20px;background:var(--line);border:1px solid var(--line)}
.opp{background:var(--card);border:0;padding:19px 20px 20px}
.opp h4{font-size:15px;font-weight:600;margin-bottom:9px;color:var(--ink);letter-spacing:-.1px;text-wrap:balance}
.opp p{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.opp .oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.opp .oh h4{margin-bottom:0}
.odate{font-size:10px;color:var(--faint);white-space:nowrap;letter-spacing:.3px}
.opp .impl{margin-top:13px}

.reg-grid{display:grid;gap:1px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));background:var(--line);border:1px solid var(--line)}
.reg{background:var(--card);border:0;padding:19px 20px 20px}
.reg .rt{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.reg .rname{font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.reg .rmeta{font-size:10.5px;color:var(--faint);letter-spacing:.3px}
.reg p{font-size:13px;color:var(--ink-2);margin:5px 0;line-height:1.6}
.reg ul{margin:7px 0 7px 17px}
.reg ul li{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-bottom:3px}
.impl{background:var(--sunken);border-left:2px solid var(--ink);padding:11px 14px;font-size:12.5px;margin-top:9px;line-height:1.65;color:var(--ink-2)}
.impl b{font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:4px}

/* ---------- Badges ---------- */
.badge{font-size:9.5px;font-weight:600;padding:3px 9px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--line)}
.badge.threat{color:var(--neg);background:var(--neg-bg);border-color:var(--neg-line)}
.badge.opp{color:var(--pos);background:var(--pos-bg);border-color:var(--pos-line)}
.badge.signal{color:var(--muted);background:var(--sunken);border-color:var(--line)}

.srclist{font-size:11px;color:var(--faint);margin-top:9px;letter-spacing:.2px;line-height:1.6}
.srclist a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.srclist a:hover{border-bottom-color:var(--ink);color:var(--ink)}

/* ---------- Caveat ---------- */
.caveat{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:2px solid var(--warn);padding:14px 17px;font-size:12.5px;color:#6B5418;margin-bottom:20px;line-height:1.7;max-width:80ch}
.caveat b{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;color:var(--warn)}

.comp-anim{animation:compIn .3s ease}
@keyframes compIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.comp-anim{animation:none}*{transition:none!important}}

/* ---------- Split layout ---------- */
.px-layout{display:grid;grid-template-columns:minmax(340px,5fr) minmax(380px,7fr);gap:28px;align-items:start}
.px-right{position:sticky;top:16px}
@media (max-width:980px){.px-layout{grid-template-columns:1fr}.px-right{position:static}}

footer{margin-top:64px;border-top:1px solid var(--line);padding-top:20px;font-size:11px;color:var(--faint);line-height:1.8;letter-spacing:.2px}

/* ---------- Focus visibility ---------- */
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[data-theme="dark"] button:focus-visible,[data-theme="dark"] select:focus-visible,[data-theme="dark"] a:focus-visible{outline-color:#fff}

@media (max-width:640px){
  .wrap{padding:0 16px 64px}
  .masthead{margin:0 -16px;padding:16px 16px 14px}
  .brand{font-size:18px;letter-spacing:2px}
  .brand-divider{display:none}
  .date-block{margin-left:0;align-items:flex-start}
  .report-date{font-size:20px}
  .lang-toggle{margin-left:0}
  .tabnav{gap:0 18px}
  .tabnav button{font-size:11.5px;padding:11px 0 10px}
  .dash-h{font-size:19px}
  .card h3{font-size:17px}
  .chart-box{height:300px;padding:12px}
  .chart-box.tall{height:360px}
  .heat{font-size:11.5px}
  .heat th{font-size:9.5px;padding:5px 2px}
  .heat td.rowh{font-size:11.5px;padding:5px 6px 5px 0}
  .heat td.cell button{min-width:0;padding:9px 2px}
}

/* =========================================================================
   Dark — byd.com's own register: charcoal ground, not black
   ========================================================================= */
[data-theme="dark"]{
  /* same correction in reverse: 5.70 and 5.23 on the card, 6.50 and 5.96 on
     the page ground — the previous #77797A was only 3.43:1 on a card */
  --ink:#F2F2F2; --ink-2:#C8C9CA; --muted:#9DA0A1; --faint:#96999A;
  --paper:#1A1C1D; --card:#252728; --sunken:#2E3031; --line:#3A3C3D; --line-2:#333536;
  --bar:#111314; --bar-ink:#FFFFFF;
  --accent:#FFFFFF; --accent-ink:#252728; --accent-soft:#33383A;
  --pos:#5FBF97; --pos-bg:#1E2E28; --pos-line:#2F4A40;
  --neg:#D98A7E; --neg-bg:#2E1F1D; --neg-line:#4A3230;
  --warn:#D9B65C; --warn-bg:#2C2718; --warn-line:#473F27;
  --cell-empty:#202223; --glow:none;
}
[data-theme="dark"] .masthead{border-bottom:1px solid var(--line)}
[data-theme="dark"] .tabnav button.on{color:#fff;border-bottom-color:#fff}
[data-theme="dark"] .subnav button.on,[data-theme="dark"] .tabs button.on{background:#fff;color:var(--card);border-color:#fff}
[data-theme="dark"] .pills button.on{background:var(--accent-soft);border-color:var(--muted);color:#fff}
[data-theme="dark"] .heat td.cell button{background:var(--sunken);color:var(--ink)}
[data-theme="dark"] .heat td.cell button:disabled{background:var(--cell-empty);color:#4A4C4D}
[data-theme="dark"] .heat td.cell button:hover{outline-color:#fff}
[data-theme="dark"] .periodbar select,[data-theme="dark"] .dash-sel,[data-theme="dark"] .date-nav select{background:var(--sunken);color:var(--ink);border-color:var(--muted)}
[data-theme="dark"] .angle,[data-theme="dark"] .impl{border-left-color:#fff}
[data-theme="dark"] .angle b,[data-theme="dark"] .impl b{color:#fff}
[data-theme="dark"] .dtable th{border-bottom-color:var(--muted)}
[data-theme="dark"] .caveat{color:#D9C18A}
[data-theme="dark"] .dtable tr.sel{background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="brandblock">
    <span class="brand">BYD <span>BRASIL</span></span>

function buildTabNav(){
  document.getElementById("tabnav").innerHTML = TAB_KEYS.map(function(k){
    return "<button class='"+(curTab===k?"on":"")+"' onclick='setTab(\""+k+"\")'>"+esc(t(TAB_UI[k]))+"</button>";
  }).join("");
}
function setTab(k){
  if(TAB_KEYS.indexOf(k)<0) return;
  curTab=k;
  try{ localStorage.setItem("bydTab",k); }catch(e){}
  TAB_KEYS.forEach(function(x){ var el=document.getElementById("tab-"+x); if(el) el.classList.toggle("on", x===k); });
  buildTabNav(); renderCurrentTab();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderCurrentTab(){
  if(curTab==="byd") renderByd();
  else if(curTab==="market") renderMarket();
  else if(curTab==="top10") renderTop10();
  else if(curTab==="china") renderChina();
  else if(curTab==="reg") renderReg();
  else if(curTab==="promo") renderPromo();
}
function buildSubnav(containerId, subs, cur, setter){
  document.getElementById(containerId).innerHTML = subs.map(function(s){
    return "<button class='"+(cur===s.k?"on":"")+"' onclick='"+setter+"(\""+s.k+"\")'>"+esc(t(s.ui))+"</button>";
  }).join("");
}
function kpiHtml(list){
  return list.map(function(x){
    var sub = fld(x,"s");
    return "<div class='kpi'><span class='k'>"+esc(fld(x,"k"))+"</span>"+
      "<span class='v"+(x.vsmall?" sm":"")+"'>"+esc(fld(x,"v"))+"</span>"+
      (sub?"<span class='s'>"+esc(sub)+"</span>":"")+"</div>";
  }).join("");
}

/* ---- BYD tab ---- */
function setBydSub(s){ curBydSub=s; renderByd(); }
function renderByd(){
  buildSubnav("bydSubnav",[{k:"bstrat",ui:"sub_bstrat"},{k:"bvol",ui:"sub_bvol"},{k:"bmodel",ui:"sub_bmodel"},{k:"bplant",ui:"sub_bplant"}],curBydSub,"setBydSub");
  ["bstrat","bvol","bmodel","bplant"].forEach(function(s){ var el=document.getElementById("sub-"+s); if(el) el.classList.toggle("on", s===curBydSub); });
  document.getElementById("bydTitle").textContent=t("tab_byd");
  var d=BYDDATA;
  if(curBydSub==="bstrat"){
    document.getElementById("bStratNote").textContent=fld(d,"strat_note");
    document.getElementById("bOppGrid").innerHTML = d.opportunities.map(function(o){
      return "<div class='opp'><div class='oh'><h4>"+esc(fld(o,"title"))+"</h4><span class='odate'>"+esc(o.as_of||"")+"</span></div>"+
        "<p>"+esc(fld(o,"text"))+"</p>"+
        (o.action?"<div class='impl'><b>▶ "+esc(t("action"))+"</b>"+esc(fld(o,"action"))+"</div>":"")+
        (o.sources?"<div class='srclist'>"+esc(t("source"))+": "+srcLinks(o.sources)+"</div>":"")+"</div>";
    }).join("");
  } else if(curBydSub==="bvol"){
    document.getElementById("bVolNote").textContent=fld(MONTHLY,"note");
    document.getElementById("bKpi").innerHTML=kpiHtml(d.kpis);
    /* Monthly series: reported months solid, derived months hatched via a lighter fill */
    var mk = Object.keys(MONTHLY.months).filter(function(k){ return MONTHLY.months[k].byd != null; }).sort();
    mkChart("bVolChart",{
      type:"bar",
      data:{labels:mk,
        datasets:[{label:t("monthly_title"),data:mk.map(function(k){return MONTHLY.months[k].byd;}),
          backgroundColor:mk.map(function(k){
            return MONTHLY.months[k].derived
              ? dimFill()
              : CHART_PALETTE[0];
          })}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){
          var m=MONTHLY.months[mk[c.dataIndex]];
          return fmtNum(c.parsed.y)+(m.derived?"  ("+t("derived_lbl")+")":"")+" — "+fld(m,"theme");
        }}}},
        scales:{y:{ticks:{callback:function(v){return fmtNum(v);}}}},
        onClick:function(e,els){ if(els.length){ setPeriod(mk[els[0].index]); setTab("news"); } }}
    });
    document.getElementById("bVolSrc").innerHTML=t("sources_lbl")+": "+srcLinks(MONTHLY.sources)+" · "+srcLinks(d.vol_sources);
  } else if(curBydSub==="bmodel"){
    document.getElementById("bModelNote").textContent=fld(d,"model_note");
    document.getElementById("bModelCaveat").innerHTML="<b>"+esc(t("caveat_lbl"))+"</b>"+esc(fld(d,"model_caveat"));
    var h="<tr><th>"+esc(t("tbl_model"))+"</th><th>"+esc(t("tbl_period"))+"</th><th style='text-align:right'>"+esc(t("tbl_units"))+"</th><th>"+esc(t("tbl_note"))+"</th><th>"+esc(t("source"))+"</th></tr>";
    d.models.forEach(function(m){
      h+="<tr><td><b>"+esc(fld(m,"name"))+"</b></td><td>"+esc(fld(m,"period"))+"</td><td class='num'>"+(m.units==null?"—":fmtNum(m.units))+"</td><td>"+esc(fld(m,"note"))+"</td>"+
        "<td>"+(m.url?"<a href='"+esc(m.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(m.src)+"</a>":esc(m.src))+"</td></tr>";
    });
    document.getElementById("bModelTable").innerHTML=h;
  } else if(curBydSub==="bplant"){
    document.getElementById("bPlantNote").textContent=fld(d,"plant_note");
    document.getElementById("bPlantKpi").innerHTML=kpiHtml(d.plant_kpis);
    var ph="<tr><th>"+esc(t("tbl_item"))+"</th><th>"+esc(t("tbl_value"))+"</th></tr>";
    d.plant_facts.forEach(function(f){ ph+="<tr><td style='white-space:nowrap'><b>"+esc(fld(f,"k"))+"</b></td><td>"+esc(fld(f,"v"))+"</td></tr>"; });
    document.getElementById("bPlantTable").innerHTML=ph;
    document.getElementById("bPlantSrc").innerHTML=t("sources_lbl")+": "+srcLinks(d.plant_sources);
  }
}

/* ---- Market tab ---- */
function setMktSub(s){ curMktSub=s; renderMarket(); }

  ["mtotal","melec"].forEach(function(s){ var el=document.getElementById("sub-"+s); if(el) el.classList.toggle("on", s===curMktSub); });
  document.getElementById("marketTitle").textContent=t("tab_market");
  var m=MARKET;
  if(curMktSub==="mtotal"){
    document.getElementById("mTotalNote").textContent=fld(m,"total_note");
    document.getElementById("mKpi").innerHTML=kpiHtml(m.kpis);
    document.getElementById("mCaveat").innerHTML="<b>"+esc(t("caveat_lbl"))+"</b>"+esc(fld(m,"caveat"));
    document.getElementById("mTotalSrc").innerHTML=t("sources_lbl")+": "+srcLinks(m.total_sources);
  } else {
    document.getElementById("mElecNote").textContent=fld(m,"elec_note");
    document.getElementById("mElecMeta").textContent=fld(m,"elec_metric");
    mkChart("mElecChart",{
      type:"doughnut",
      data:{labels:m.elec.map(function(e){return fld(e,"name");}),
        datasets:[{data:m.elec.map(function(e){return e.units;}),
          backgroundColor:m.elec.map(function(e,i){return CHART_PALETTE[i%CHART_PALETTE.length];})}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"right"},tooltip:{callbacks:{label:function(c){
          return c.label+": "+fmtNum(c.parsed)+" ("+m.elec[c.dataIndex].share+"%)";
        }}}}}
    });
    var eh="<tr><th>"+esc(t("tbl_tech"))+"</th><th style='text-align:right'>"+esc(t("tbl_units"))+"</th><th style='text-align:right'>"+esc(t("tbl_share"))+"</th></tr>";
    m.elec.forEach(function(e){ eh+="<tr><td>"+esc(fld(e,"name"))+"</td><td class='num'>"+fmtNum(e.units)+"</td><td class='num'>"+e.share+"%</td></tr>"; });
    eh+="<tr><td><b>"+esc(t("tbl_total"))+"</b></td><td class='num'><b>215,023</b></td><td class='num'><b>100%</b></td></tr>";
    document.getElementById("mElecTable").innerHTML=eh;
    document.getElementById("mElecSrc").innerHTML=t("sources_lbl")+": "+srcLinks(m.elec_sources);
  }
}

/* ---- Top-10 tab ---- */
function selectBrand(i){ topSel=i; renderTop10(); }
function renderTop10(){
  var b=BRANDS;
  document.getElementById("topTitle").textContent=t("tab_top10");
  document.getElementById("topNote").textContent=fld(b,"note");
  document.getElementById("topMeta").textContent=fld(b,"period")+" · "+t("dq_lbl")+": "+fld(b,"data_quality");
  var h="<tr><th>"+esc(t("tbl_rank"))+"</th><th>"+esc(t("tbl_brand"))+"</th><th style='text-align:right'>"+esc(t("tbl_units"))+"</th><th style='text-align:right'>"+esc(t("tbl_share"))+"</th></tr>";
  b.rows.forEach(function(r,i){
    h+="<tr class='pick"+(topSel===i?" sel":"")+(r.me?" me":"")+"' onclick='selectBrand("+i+")'>"+
      "<td class='num'>"+r.rank+"</td><td>"+esc(r.name)+(r.me?" ◆":(r.cn?" ·CN":""))+"</td>"+
      "<td class='num'>"+fmtNum(r.units)+"</td><td class='num'>"+r.share.toFixed(1)+"%</td></tr>";
  });
  document.getElementById("topTable").innerHTML=h;
  if(topSel==null||topSel>=b.rows.length) topSel=0;
  var sel=b.rows[topSel];
  document.getElementById("topDetailName").textContent=sel.name;
  document.getElementById("topDetailMeta").textContent=sel.group+" · "+fld(sel,"origin");
  document.getElementById("topDq").innerHTML="<span class='dq "+dqClass(b.data_quality)+"'>"+esc(t("dq_lbl"))+": "+esc(fld(b,"data_quality"))+"</span>";
  mkChart("topChart",{
    type:"bar",
    data:{labels:b.rows.map(function(r){return r.name;}),
      datasets:[{label:t("tbl_share"),data:b.rows.map(function(r){return r.share;}),
        backgroundColor:b.rows.map(function(r,i){ return i===topSel ? CHART_PALETTE[0] : dimFill(); })}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){
        var r=b.rows[c.dataIndex]; return r.share.toFixed(1)+"% · "+fmtNum(r.units);
      }}}},
      scales:{x:{ticks:{callback:function(v){return v+"%";}}}},
      onClick:function(e,els){ if(els.length) selectBrand(els[0].index); }}
  });
  document.getElementById("topFacts").innerHTML =
    "<ul style='margin:0 0 10px 18px'>"+(fld(sel,"facts")||[]).map(function(f){return "<li style='font-size:13px;line-height:1.6;margin-bottom:3px'>"+esc(f)+"</li>";}).join("")+"</ul>";
  document.getElementById("topSrc").innerHTML=t("sources_lbl")+": "+srcLinks(b.sources);
}

/* ---- Chinese brands tab ---- */
function setChinaType(i){ curChinaType=i; renderChina(); }
function renderChina(){
  var c=CHINA;
  document.getElementById("chinaTitle").textContent=t("tab_china");
  document.getElementById("chinaNote").textContent=fld(c,"note")+"  "+t("dq_lbl")+": "+fld(c,"data_quality");
  if(curChinaType>=c.types.length) curChinaType=0;
  document.getElementById("chinaTypes").innerHTML=c.types.map(function(ty,i){
    return "<button class='"+(i===curChinaType?"on":"")+"' onclick='setChinaType("+i+")'>"+esc(fld(ty,"name"))+" ("+ty.brands.length+")</button>";
  }).join("");
  var bcls={Threat:"threat",Opportunity:"opp",Signal:"signal"};
  var ty=c.types[curChinaType];
  var h="<div class='reg-grid'>"+ty.brands.map(function(b){
    var pts=(fld(b,"points")||[]).map(function(p){return "<li>"+esc(p)+"</li>";}).join("");
    return "<div class='reg'><div class='rt'><span class='rname'>"+esc(b.company)+"</span>"+
      "<span class='badge "+(bcls[b.impact]||"signal")+"'>"+esc(impactTxt(b.impact))+"</span>"+
      "<span class='rmeta'>"+esc(fld(b,"location")||"")+"</span></div>"+
      (pts?"<ul>"+pts+"</ul>":"")+
      (b.implication?"<div class='impl'><b>◆ "+esc(t("angle"))+"</b>"+esc(fld(b,"implication"))+"</div>":"")+
      (b.url?"<div class='srclist'><a href='"+esc(b.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("source"))+"</a></div>":"")+
      "</div>";
  }).join("")+"</div>";
  document.getElementById("chinaBody").innerHTML="<div class='comp-anim'>"+h+"</div>";
}

        })},

        scales:{y:{beginAtZero:true,max:40,ticks:{callback:function(v){return v+"%";}}}}}

    var th="<tr><th>"+esc(t("tbl_category"))+"</th><th>2024-01</th><th>2024-07</th><th>2025-07</th><th>2026-07 →</th></tr>";
    r.tariff_rows.forEach(function(row){

    });
    document.getElementById("tariffTable").innerHTML=th;
    document.getElementById("rTariffSrc").innerHTML=t("sources_lbl")+": "+srcLinks(r.tariff_sources);
  } else {
    document.getElementById("regBody").innerHTML="<div class='comp-anim'><div class='reg-grid'>"+r.rules.map(function(it){
      return "<div class='reg'><div class='rt'><span class='rname'>"+esc(fld(it,"name"))+"</span>"+
        "<span class='rmeta'>"+esc(fld(it,"type"))+" · "+esc(fld(it,"status"))+" · "+esc(it.date)+"</span></div>"+
        "<p>"+esc(fld(it,"requires"))+"</p>"+

        (it.url?"<div class='srclist'><a href='"+esc(it.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("source"))+"</a></div>":"")+
        "</div>";
    }).join("")+"</div></div>";
  }
}

/* ---- Sales policies ---- */
function setPromoSub(s){ curPromoSub=s; renderPromo(); }
function renderPromo(){
  var p=PROMO;
  buildSubnav("promoSubnav",[{k:"pmech",ui:"sub_pmech"},{k:"pbrand",ui:"sub_pbrand"},{k:"pread",ui:"sub_pread"}],curPromoSub,"setPromoSub");
  ["pmech","pbrand","pread"].forEach(function(s){ var el=document.getElementById("sub-"+s); if(el) el.classList.toggle("on", s===curPromoSub); });
  document.getElementById("promoTitle").textContent=t("tab_promo");
  document.getElementById("promoNote").textContent=fld(p,"note");
  document.getElementById("promoMeta").textContent=fld(p,"meta");
  document.getElementById("promoCaveat").innerHTML="<b>"+esc(t("caveat_lbl"))+"</b>"+esc(fld(p,"caveat"));

  if(curPromoSub==="pmech"){
    document.getElementById("pMechNote").textContent=fld(p,"mech_note");
    document.getElementById("pMechGrid").innerHTML=p.mechanisms.map(function(m){
      return "<div class='opp'><h4>"+esc(fld(m,"title"))+"</h4><p>"+esc(fld(m,"text"))+"</p>"+
        (m.impl?"<div class='impl'><b>◆ "+esc(t("angle"))+"</b>"+esc(fld(m,"impl"))+"</div>":"")+"</div>";
    }).join("");
    document.getElementById("pAggTitle").textContent=t("p_agg_title");
    document.getElementById("pAggNote").textContent=fld(p,"agg_note");
    mkChart("promoChart",{
      type:"bar",
      data:{labels:p.agg.map(function(a){return a.name;}),
        datasets:[{label:"R$",data:p.agg.map(function(a){return a.value;}),
          backgroundColor:p.agg.map(function(a){ return a.name==="BYD" ? CHART_PALETTE[0] : dimFill(); })}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){
          return "R$ "+fmtNum(c.parsed.y)+" — "+fld(p.agg[c.dataIndex],"kind");
        }}}},
        scales:{y:{ticks:{callback:function(v){return "R$ "+fmtNum(v);}}}}}
    });
    document.getElementById("pAggSrc").innerHTML=t("sources_lbl")+": "+srcLinks(p.agg_sources);

  } else if(curPromoSub==="pbrand"){
    document.getElementById("pBrandNote").textContent=fld(p,"brand_note");
    var bcls={Threat:"threat",Opportunity:"opp",Signal:"signal"};
    document.getElementById("promoBody").innerHTML="<div class='comp-anim'><div class='reg-grid'>"+p.brands.map(function(b){
      var pts=(fld(b,"points")||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");
      return "<div class='reg'><div class='rt'><span class='rname'>"+esc(b.company)+"</span>"+
        "<span class='badge "+(bcls[b.impact]||"signal")+"'>"+esc(impactTxt(b.impact))+"</span>"+
        "<span class='rmeta'>"+esc(fld(b,"status"))+"</span></div>"+
        (pts?"<ul>"+pts+"</ul>":"")+
        (b.implication?"<div class='impl'><b>◆ "+esc(t("angle"))+"</b>"+esc(fld(b,"implication"))+"</div>":"")+
        (b.url?"<div class='srclist'><a href='"+esc(b.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("source"))+"</a></div>":"")+
        "</div>";
    }).join("")+"</div></div>";

  } else {
    document.getElementById("pReadNote").textContent=fld(p,"read_note");
    document.getElementById("pReadGrid").innerHTML=p.reads.map(function(r){
      return "<div class='opp'><h4>"+esc(fld(r,"title"))+"</h4><p>"+esc(fld(r,"text"))+"</p>"+
        (r.impl?"<div class='impl'><b>▶ "+esc(t("action"))+"</b>"+esc(fld(r,"impl"))+"</div>":"")+"</div>";
    }).join("");
  }
}

/* ---- boot ---- */
function refresh(){
  buildLangToggle(); buildPeriodSelect(); buildTabNav(); buildHeat(); buildFilters(); buildCards();
  applyStaticText(); renderSnapshot(); renderCurrentTab();
}
applyTheme(themeDark);
TAB_KEYS.forEach(function(x){ var el=document.getElementById("tab-"+x); if(el) el.classList.toggle("on", x===curTab); });
refresh();
</script>
