<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Brasil Radar</title>
<script>(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem("bydTheme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=r.getAttribute("data-theme");}
if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
r.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#12211A; --paper:#F1F6F2; --teal:#0B6E3D; --teal-lt:#E2F2E8;
  --line:#D4E6DA; --muted:#5A6E63; --card:#FFFFFF; --amber:#B7791F; --emer:#12A06B;
  --cell-empty:#FFFFFF; --glow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
/* Masthead */
.masthead{border-bottom:3px solid var(--ink);padding:22px 0 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brandblock{display:flex;align-items:center;gap:14px}
.brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--teal)}
.brand-divider{width:1px;height:40px;background:var(--line)}
.subbrand{display:flex;align-items:center;gap:8px;color:var(--teal)}
.subbrand .radar{flex:none}
.subbrand-txt{font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);line-height:1.05}
.date-block{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.report-date{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;color:var(--teal);letter-spacing:1px;line-height:1.1}
.date-window{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.date-nav{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.date-nav-label{font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.date-nav select{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:5px 10px;border:1.5px solid var(--teal);border-radius:3px;background:#fff;color:var(--ink);cursor:pointer}
/* Language toggle */
.lang-toggle{margin-left:auto;display:flex;flex-wrap:wrap;border:1.5px solid var(--teal);border-radius:3px;overflow:hidden;flex-shrink:0}
.lang-toggle button{font-family:'Archivo','Microsoft JhengHei','PingFang TC',sans-serif;font-size:12px;font-weight:600;letter-spacing:.5px;padding:5px 11px;border:0;border-left:1px solid var(--teal-lt);background:#fff;color:var(--teal);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;min-height:26px}
.lang-toggle button:first-child{border-left:0}
.lang-toggle button.on{background:var(--teal);color:#fff}
/* At a glance */
.glance{margin-top:24px}
h2.sec{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
h2.sec .hint{font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
.summary{font-size:16px;max-width:860px;margin-bottom:18px}
.summary-list{list-style:none;margin:0;padding:0}
.summary-list li{position:relative;padding-left:20px;margin-bottom:10px;line-height:1.65}
.summary-list li:last-child{margin-bottom:0}
.summary-list li::before{content:"\25B8";position:absolute;left:2px;top:2px;color:var(--teal);font-size:13px}
.heat{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13px}
.heat th{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12px;color:var(--muted);padding:6px 8px;text-align:center}
.heat th.rowh{text-align:left}
.heat td.rowh{font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:13px;padding:6px 8px;white-space:nowrap}
.heat td.cell{text-align:center;padding:0}
.heat td.cell button{width:100%;border:1px solid var(--line);background:#fff;padding:9px 4px;font:inherit;color:var(--ink);cursor:pointer;min-width:44px}
.heat td.cell button:hover{outline:2px solid var(--teal);outline-offset:-2px}
.heat td.cell button:disabled{cursor:default;color:#B9C2BD}
.heat td.cell button:disabled:hover{outline:none}
/* Filter bar */
.filters{position:sticky;top:0;background:var(--paper);padding:14px 0 12px;margin-top:28px;border-bottom:1px solid var(--line);z-index:5}
.tabs,.pills{display:flex;flex-wrap:wrap;gap:8px}
.tabs{margin-bottom:10px}
.tabs button{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-weight:500;font-size:13.5px;padding:7px 14px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;border-radius:2px;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .n{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.7;margin-left:5px}
.pills button{font-size:12.5px;padding:5px 13px;border:1px solid var(--muted);background:transparent;color:var(--muted);cursor:pointer;border-radius:999px}
.pills button.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* Cards */
.cards{margin-top:20px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--emer);padding:16px 18px}
.card.threat{border-left-color:#C0392B}
.card.opp{border-left-color:var(--teal)}
.card .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.card .co{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px}
.card .loc{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.card .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--teal);border:1px solid var(--teal-lt);background:var(--teal-lt);padding:2px 8px;border-radius:999px;margin-left:auto}
.card .tag.low{color:var(--amber);background:#FBF3E4;border-color:#F0E3C8}
.card h3{font-size:16.5px;font-weight:600;line-height:1.4;margin-bottom:8px}
.card ul{list-style:none;margin-bottom:10px}
.card ul li{font-size:13.5px;color:#324038;padding-left:16px;position:relative;margin-bottom:3px}
.card ul li::before{content:"–";position:absolute;left:0;color:var(--teal)}
.angle{background:var(--teal-lt);border-left:3px solid var(--teal);border-radius:0 3px 3px 0;padding:9px 12px;font-size:13.5px}
.angle b{font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:2px}
.src{margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.src a{color:var(--teal);text-decoration:none;border-bottom:1px solid var(--teal-lt)}
.src a:hover{border-bottom-color:var(--teal)}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-style:italic;display:none}
footer{margin-top:48px;border-top:1px solid var(--line);padding-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);line-height:1.7}
@media (max-width:640px){
  .brand{font-size:20px}
  .brand-divider{display:none}
  .date-block{margin-left:0;align-items:flex-start}
  .report-date{font-size:22px}
  .lang-toggle{margin-left:0}
  .heat{font-size:11.5px}
  .heat th{font-size:10.5px;padding:4px 2px}
  .heat td.rowh{font-size:11.5px;padding:4px 4px}
  .heat td.cell button{min-width:0;padding:7px 2px}
}
/* ===== Tab navigation ===== */
.tabnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;border-bottom:2px solid var(--ink);padding-bottom:0}
.tabnav button{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-weight:600;font-size:13px;letter-spacing:.4px;padding:9px 15px;border:1.5px solid var(--line);border-bottom:0;background:#fff;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;position:relative;top:2px}
.tabnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabnav button:not(.on):hover{color:var(--teal);border-color:var(--teal)}
.tabpanel{display:none}
.tabpanel.on{display:block}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.subnav button{font-size:12.5px;padding:6px 13px;border:1px solid var(--muted);background:transparent;color:var(--muted);cursor:pointer;border-radius:999px}
.subnav button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.subnav.sub2{margin:8px 0 4px}
.subnav.sub2 button{font-size:11.5px;padding:4px 11px}
.subpanel{display:none}
.subpanel.on{display:block}
/* Shared dashboard bits */
.dash-h{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-weight:700;font-size:17px;margin:18px 0 4px;color:var(--ink)}
.dash-note{font-size:13px;color:var(--muted);max-width:860px;margin-bottom:14px;line-height:1.6}
.dash-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:10px}
.chart-box{position:relative;height:340px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px}
.chart-box.tall{height:430px}
.dq{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);margin:2px 0}
.dq.high{color:#0B6E3D;border-color:var(--teal-lt);background:var(--teal-lt)}
.dq.medium{color:var(--amber);background:#FBF3E4;border-color:#F0E3C8}
.dq.low{color:#C0392B;background:#FBEAE8;border-color:#F3D2CD}
/* KPI tiles */
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.kpi .k{font-family:'Archivo',sans-serif;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:500;color:var(--teal);line-height:1.1;display:block}
.kpi .s{font-size:11.5px;color:var(--muted);display:block;margin-top:4px;line-height:1.45}
/* Tables */
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px;background:var(--card)}
.dtable th{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
.dtable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dtable td.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
.dtable tr.pick{cursor:pointer}
.dtable tr.pick:hover{background:var(--teal-lt)}
.dtable tr.sel{background:var(--teal-lt)}
.dtable tr.me td{font-weight:600}
.up{color:#0B6E3D}.down{color:#C0392B}
.tbl-scroll{overflow-x:auto;margin-bottom:14px}
.dash-sel{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 10px;border:1.5px solid var(--teal);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;margin-bottom:12px}
/* Opportunity / entity cards */
.opp-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-bottom:14px}
.opp{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--emer);border-radius:4px;padding:13px 15px}
.opp h4{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-size:14px;margin-bottom:6px;color:var(--ink)}
.opp p{font-size:13px;color:#324038;line-height:1.55}
.opp .oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.opp .oh h4{margin-bottom:0}
.odate{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.opp .impl{margin-top:9px}
.reg-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.reg{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.reg .rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.reg .rname{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-weight:700;font-size:13.5px}
.reg .rmeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
.reg p{font-size:12.5px;color:#324038;margin:3px 0;line-height:1.5}
.reg ul{margin:4px 0 4px 18px}
.reg ul li{font-size:12.5px;color:#324038;line-height:1.5}
.impl{background:var(--teal-lt);border-left:3px solid var(--teal);border-radius:0 3px 3px 0;padding:7px 10px;font-size:12.5px;margin-top:6px}
.impl b{font-family:'Archivo','Microsoft JhengHei',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:2px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.badge.threat{color:#C0392B;background:#FBEAE8;border:1px solid #F3D2CD}
.badge.opp{color:#0B6E3D;background:var(--teal-lt);border:1px solid var(--teal-lt)}
.badge.signal{color:#5A6E63;background:#EDF2EF;border:1px solid var(--line)}
.srclist{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px}
.srclist a{color:var(--teal);text-decoration:none;border-bottom:1px solid var(--teal-lt)}
.comp-anim{animation:compIn .28s ease}
@keyframes compIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Split layout for the brand ranking tab */
.px-layout{display:grid;grid-template-columns:minmax(340px,5fr) minmax(380px,7fr);gap:20px;align-items:start}
.px-right{position:sticky;top:12px}
@media (max-width:980px){.px-layout{grid-template-columns:1fr}.px-right{position:static}}
@media (max-width:640px){
  .tabnav button{font-size:11.5px;padding:8px 10px}
  .chart-box{height:300px;padding:8px}
  .chart-box.tall{height:380px}
}
/* Caveat banner */
.caveat{background:#FBF3E4;border:1px solid #F0E3C8;border-left:4px solid var(--amber);border-radius:0 4px 4px 0;padding:10px 13px;font-size:12.5px;color:#6B5418;margin-bottom:16px;line-height:1.6}
.caveat b{display:block;font-family:'Archivo','Microsoft JhengHei',sans-serif;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;color:var(--amber)}
/* Theme toggle */
.theme-btn{font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1;padding:5px 10px;border:1.5px solid var(--teal);border-radius:3px;background:var(--card);color:var(--teal);cursor:pointer;box-shadow:var(--glow)}
.theme-btn:hover{background:var(--teal-lt)}
/* ===== Dark theme ===== */
[data-theme="dark"]{
  --ink:#D6EDE2; --paper:#0A1512; --teal:#34D399; --teal-lt:#0E2A20;
  --line:#1D3A2E; --muted:#5F8474; --card:#0E1F19; --amber:#E0A93B; --emer:#34D399;
  --cell-empty:#0A1A15; --glow:0 0 12px rgba(52,211,153,.40);
}
[data-theme="dark"] .masthead{border-bottom-color:var(--line);position:relative}
[data-theme="dark"] .masthead::before,[data-theme="dark"] .masthead::after{content:"";position:absolute;top:4px;width:15px;height:15px;border-top:2px solid var(--teal);pointer-events:none}
[data-theme="dark"] .masthead::before{left:0;border-left:2px solid var(--teal)}
[data-theme="dark"] .masthead::after{right:0;border-right:2px solid var(--teal)}
[data-theme="dark"] .lang-toggle button:not(.on),[data-theme="dark"] .date-nav select,[data-theme="dark"] .dash-sel{background:var(--card);color:var(--ink)}
[data-theme="dark"] .lang-toggle button{border-left-color:var(--line)}
[data-theme="dark"] .lang-toggle button.on,[data-theme="dark"] .pills button.on,[data-theme="dark"] .subnav button.on{color:#04221A}
[data-theme="dark"] .heat td.cell button{background:var(--cell-empty);color:var(--ink)}
[data-theme="dark"] .tabs button{background:var(--card);border-color:var(--muted);color:var(--ink)}
[data-theme="dark"] .tabs button.on{background:var(--teal);color:#04221A;border-color:var(--teal)}
[data-theme="dark"] .tabnav{border-bottom:1px solid var(--line)}
[data-theme="dark"] .tabnav button{background:transparent;border:0;border-radius:0;top:1px;color:var(--muted);padding:9px 4px;margin-right:16px}
[data-theme="dark"] .tabnav button.on{background:transparent;color:var(--teal);border-bottom:2px solid var(--teal);box-shadow:none}
[data-theme="dark"] .tabnav button:not(.on):hover{color:var(--teal);border-color:transparent}
[data-theme="dark"] .subnav button.on{box-shadow:0 0 12px rgba(52,211,153,.35)}
[data-theme="dark"] .card ul li,[data-theme="dark"] .opp p,[data-theme="dark"] .reg p,[data-theme="dark"] .reg ul li{color:#A9C9BB}
[data-theme="dark"] .dq{background:var(--card)}
[data-theme="dark"] .dq.high{color:#34D399}
[data-theme="dark"] .dq.medium{background:#241C0C;border-color:#3A2E12}
[data-theme="dark"] .card .tag.low{background:#241C0C;border-color:#3A2E12}
[data-theme="dark"] .dq.low,[data-theme="dark"] .badge.threat{color:#F0997B;background:#2A1512;border-color:#5A2A22}
[data-theme="dark"] .badge.opp{color:#34D399}
[data-theme="dark"] .badge.signal{color:#8FC4AE;background:#12241D}
[data-theme="dark"] .caveat{background:#241C0C;border-color:#3A2E12;color:#D9C18A}
[data-theme="dark"] .up{color:#4ADE80}
[data-theme="dark"] .down{color:#F0997B}
[data-theme="dark"] .report-date{text-shadow:0 0 10px rgba(52,211,153,.5)}
[data-theme="dark"] .subbrand .radar{filter:drop-shadow(0 0 6px rgba(52,211,153,.55))}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="brandblock">
    <span class="brand">BYD <span>BRASIL</span></span>
    <span class="brand-divider"></span>
    <span class="subbrand">
      <svg class="radar" viewBox="0 0 40 40" width="32" height="32" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"/><path d="M20 20 L20 3 A17 17 0 0 1 34 12 Z" fill="currentColor" opacity=".18"/><line x1="20" y1="20" x2="34" y2="12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="29" cy="14" r="2.4" fill="currentColor"/></svg>
      <span class="subbrand-txt">Market<br>Radar</span>
    </span>
  </div>
  <div class="date-block">
    <span class="report-date">2026-09-13</span>
    <span class="date-window" id="windowLbl">資料窗口：2026 年 1–8 月累計</span>
    <span class="date-window">updated 2026-09-13 (UTC-3)</span>
  </div>
  <div class="date-nav">
    <span class="date-nav-label" id="archiveLabel">歷史報告</span>
    <select id="archiveSel" onchange="if(this.value!=='#') window.location=this.value">
      <option value="#" selected>2026-09-13</option>
    </select>
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark / light" title="Dark / Light"><span id="themeIcon">☾</span></button>
    <div class="lang-toggle" id="langToggle"></div>
  </div>
</header>

<nav class="tabnav" id="tabnav"></nav>

<!-- ===== 1. MARKET NEWS ===== -->
<section class="tabpanel on" id="tab-news">
<section class="glance">
  <h2 class="sec" style="margin-top:22px"><span id="glanceTitle">重點摘要</span> <span class="hint" id="glanceHint">— 點數字篩選</span></h2>
  <div class="summary" id="summary"></div>
  <table class="heat" id="heat"></table>
</section>
<nav class="filters" id="filters">
  <div class="tabs" id="tabs"></div>
  <div class="pills" id="pills"></div>
</nav>
<main>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty"></div>
</main>
</section>

<!-- ===== 2. BYD ===== -->
<section class="tabpanel" id="tab-byd">
  <h2 class="dash-h" id="bydTitle">BYD 戰情</h2>
  <div class="subnav" id="bydSubnav"></div>

function t(k){ return (UI[k] && UI[k][lang]) || (UI[k] && UI[k]["zh-Hant"]) || ""; }

var sectorKeys = Object.keys(SECTORS), regionKeys = Object.keys(REGIONS);
var fSector="all", fRegion="all";
function sectorLabel(s){ return fld(SECTORS[s]||{}, "label") || s; }
function regionLabel(r){ return fld(REGIONS[r]||{}, "label") || r; }
function regionShort(r){ return fld(REGIONS[r]||{}, "short") || regionLabel(r); }
function count(s,r){ return NEWS.filter(function(it){ return (s==="all"||it.sector===s)&&(r==="all"||it.region===r); }).length; }

function buildLangToggle(){
  document.getElementById("langToggle").innerHTML = LANGS.map(function(l){
    return "<button class='"+(lang===l?"on":"")+"' onclick='setLang(\""+l+"\")'>"+esc(LANG_LABEL[l])+"</button>";
  }).join("");
}
function buildHeat(){
  var max=1;
  sectorKeys.forEach(function(s){ regionKeys.forEach(function(r){ max=Math.max(max,count(s,r)); }); });
  var h="<tr><th class='rowh'></th>";
  regionKeys.forEach(function(r){ h+="<th>"+esc(regionShort(r))+"</th>"; });
  h+="</tr>";
  sectorKeys.forEach(function(s){
    h+="<tr><td class='rowh'>"+esc(sectorLabel(s))+"</td>";
    regionKeys.forEach(function(r){
      var n=count(s,r), a=n/max;
      var bg = n===0 ? "var(--cell-empty)" : "rgba(18,160,107,"+(0.12+0.55*a).toFixed(2)+")";
      var fg = a>0.6 ? "#fff" : "var(--ink)";
      h+="<td class='cell'><button "+(n===0?"disabled":"")+" style='background:"+bg+";color:"+fg+"' onclick='setFilter(\""+s+"\",\""+r+"\")'>"+n+"</button></td>";
    });
    h+="</tr>";
  });
  document.getElementById("heat").innerHTML=h;
}
function buildFilters(){
  var tb="<button class='"+(fSector==="all"?"on":"")+"' onclick='setSector(\"all\")'>"+esc(t("allSectors"))+" <span class='n'>"+count("all",fRegion)+"</span></button>";
  sectorKeys.forEach(function(s){
    tb+="<button class='"+(fSector===s?"on":"")+"' onclick='setSector(\""+s+"\")'>"+esc(sectorLabel(s))+" <span class='n'>"+count(s,fRegion)+"</span></button>";
  });
  document.getElementById("tabs").innerHTML=tb;
  var p="<button class='"+(fRegion==="all"?"on":"")+"' onclick='setRegion(\"all\")'>"+esc(t("allRegions"))+" ("+count(fSector,"all")+")</button>";
  regionKeys.forEach(function(r){
    p+="<button class='"+(fRegion===r?"on":"")+"' onclick='setRegion(\""+r+"\")'>"+esc(regionLabel(r))+" ("+count(fSector,r)+")</button>";
  });
  document.getElementById("pills").innerHTML=p;
}
var IMPACT_CLS={Threat:"threat",Opportunity:"opp",Signal:""};
function impactTxt(i){ return i==="Threat"?t("t_threat"):i==="Opportunity"?t("t_opp"):t("t_signal"); }
function buildCards(){
  var items=NEWS.filter(function(it){ return (fSector==="all"||it.sector===fSector)&&(fRegion==="all"||it.region===fRegion); });
  document.getElementById("cards").innerHTML = items.map(function(it){
    var pts=(fld(it,"key_points")||[]).map(function(k){ return "<li>"+esc(k)+"</li>"; }).join("");
    var tag = it.confidence==="low"
      ? "<span class='tag low'>"+esc(t("lowConf"))+"</span>"
      : "<span class='tag'>"+esc(impactTxt(it.impact))+"</span>";
    var ang=fld(it,"insight");
    var src = it.source_url ? "<div class='src'>"+esc(t("source"))+": <a href='"+esc(it.source_url)+"' target='_blank' rel='noopener noreferrer'>"+esc(it.source_name||it.source_url)+"</a>"+(it.as_of?" · "+esc(it.as_of):"")+"</div>" : "";
    return "<article class='card "+(IMPACT_CLS[it.impact]||"")+"'>"+
      "<div class='top'><span class='co'>"+esc(fld(it,"company"))+"</span><span class='loc'>"+esc(fld(it,"location")||regionLabel(it.region))+"</span>"+tag+"</div>"+
      "<h3>"+esc(fld(it,"headline"))+"</h3>"+
      (pts?"<ul>"+pts+"</ul>":"")+
      (ang?"<div class='angle'><b>◆ "+esc(t("angle"))+"</b>"+esc(ang)+"</div>":"")+
      src+"</article>";
  }).join("");
  document.getElementById("empty").style.display = items.length?"none":"block";
}
function splitSummary(text){
  if(!text) return [];
  var out=[],buf="";
  for(var i=0;i<text.length;i++){
    var ch=text[i], next=text[i+1]||"";
    buf+=ch;
    if(ch==="。"){ out.push(buf); buf=""; }
    else if((ch==="."||ch==="!"||ch==="?")&&(next===""||/\s/.test(next))){ out.push(buf); buf=""; }
  }
  if(buf) out.push(buf);
  return out.map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
}
function renderSummary(){
  var el=document.getElementById("summary"); if(!el) return;
  while(el.firstChild) el.removeChild(el.firstChild);
  var text=fld(META,"summary");
  var pts=splitSummary(text);
  if(pts.length<=1){ el.textContent=text||""; return; }
  var ul=document.createElement("ul"); ul.className="summary-list";
  pts.forEach(function(p){ var li=document.createElement("li"); li.textContent=p; ul.appendChild(li); });
  el.appendChild(ul);
}
function applyStaticText(){
  document.documentElement.lang = lang==="pt" ? "pt-BR" : lang;

}

  document.getElementById("regTitle").textContent=t("tab_reg");
  var r=REGDATA;
  document.getElementById("regNote").textContent=fld(r,"note");
  if(curRegSub==="rtariff"){
    document.getElementById("rTariffNote").textContent=fld(r,"tariff_note");
    mkChart("tariffChart",{
      type:"line",
      data:{labels:r.tariff_months,
        datasets:r.tariff_series.map(function(s,i){
          return {label:fld(s,"name"),data:s.values,borderColor:CHART_PALETTE[i],backgroundColor:CHART_PALETTE[i],tension:.15,pointRadius:4};
        })},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:true},tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+c.parsed.y+"%";}}}},
        scales:{y:{beginAtZero:true,max:40,ticks:{callback:function(v){return v+"%";}}}}}
    });
    var th="<tr><th>"+esc(t("tbl_category"))+"</th><th>2024-01</th><th>2024-07</th><th>2025-07</th><th>2026-07 →</th></tr>";
    r.tariff_rows.forEach(function(row){
      th+="<tr><td><b>"+esc(fld(row,"item"))+"</b></td><td class='num'>"+esc(row.v2401)+"</td><td class='num'>"+esc(row.v2407)+"</td><td class='num'>"+esc(row.v2507)+"</td><td>"+esc(fld(row,"v2607"))+"</td></tr>";
    });
    document.getElementById("tariffTable").innerHTML=th;
    document.getElementById("rTariffSrc").innerHTML=t("sources_lbl")+": "+srcLinks(r.tariff_sources);
  } else {
    document.getElementById("regBody").innerHTML="<div class='comp-anim'><div class='reg-grid'>"+r.rules.map(function(it){
      return "<div class='reg'><div class='rt'><span class='rname'>"+esc(fld(it,"name"))+"</span>"+
        "<span class='rmeta'>"+esc(fld(it,"type"))+" · "+esc(fld(it,"status"))+" · "+esc(it.date)+"</span></div>"+
        "<p>"+esc(fld(it,"requires"))+"</p>"+
        (it.implication?"<div class='impl'><b>◆ "+esc(t("angle"))+"</b>"+esc(fld(it,"implication"))+"</div>":"")+
        (it.url?"<div class='srclist'><a href='"+esc(it.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("source"))+"</a></div>":"")+
        "</div>";
    }).join("")+"</div></div>";
  }
}

/* ---- boot ---- */
function refresh(){
  buildLangToggle(); buildTabNav(); buildHeat(); buildFilters(); buildCards(); applyStaticText(); renderCurrentTab();
}
applyTheme(themeDark);
TAB_KEYS.forEach(function(x){ var el=document.getElementById("tab-"+x); if(el) el.classList.toggle("on", x===curTab); });
refresh();
</script>
</body>
</html>
